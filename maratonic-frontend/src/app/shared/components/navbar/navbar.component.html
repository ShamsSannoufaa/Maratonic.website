<nav class="navbar">
  <div class="nav-content">

    <!-- LOGO -->
    <a routerLink="/" class="logo" (click)="closeMenu()">Maratonic</a>

    <!-- Hamburger -->
    <div class="hamburger" (click)="toggleMenu()">
      <i class="fas" [ngClass]="isMenuOpen ? 'fa-times' : 'fa-bars'"></i>
    </div>

    <!-- MENU -->
    <ul class="nav-links" [class.active]="isMenuOpen">

      <li>
        <a routerLink="/"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="closeMenu()">
          Anasayfa
        </a>
      </li>

      <li>
        <a routerLink="/races"
           routerLinkActive="active"
           (click)="closeMenu()">
          Yarışlar
        </a>
      </li>

      <li>
        <a routerLink="/calendar"
           routerLinkActive="active"
           (click)="closeMenu()">
          Takvim
        </a>
      </li>

      <!-- Admin Görünümü -->
      <li *ngIf="isLoggedIn && isAdmin">
        <a routerLink="/admin"
           routerLinkActive="active"
           (click)="closeMenu()">
          Admin Paneli
        </a>
      </li>

      <!-- Profil (Mobil Menü) -->
      <li *ngIf="isLoggedIn && isMenuOpen">
        <a routerLink="/profile"
           routerLinkActive="active"
           (click)="closeMenu()">
          Profilim
        </a>
      </li>

      <!-- Mobil Auth -->
      <div class="mobile-auth" *ngIf="isMenuOpen">

        <!-- Giriş yapmamışsa -->
        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/login" class="btn login-btn" (click)="closeMenu()">Giriş Yap</a>
          <a routerLink="/register" class="btn signup-btn" (click)="closeMenu()">Kayıt Ol</a>
        </ng-container>

        <!-- Giriş yapmışsa -->
        <ng-container *ngIf="isLoggedIn">
          <a routerLink="/profile" class="btn login-btn" (click)="closeMenu()">Profil</a>
          <button class="btn logout-btn" (click)="logout(); closeMenu()">Çıkış Yap</button>
        </ng-container>

      </div>

    </ul>

    <!-- DESKTOP AUTH -->
    <div class="nav-right">

      <!-- Giriş yapmamışsa -->
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" class="btn login-btn">Giriş Yap</a>
        <a routerLink="/register" class="btn signup-btn">Kayıt Ol</a>
      </ng-container>

      <!-- Giriş yapmışsa -->
      <ng-container *ngIf="isLoggedIn">
        <a routerLink="/profile" class="btn login-btn">Profil</a>
        <button class="btn logout-btn" (click)="logout()">Çıkış Yap</button>
      </ng-container>

    </div>

  </div>
</nav>
