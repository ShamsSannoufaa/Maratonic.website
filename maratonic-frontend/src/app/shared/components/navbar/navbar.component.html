<nav class="navbar">
  <div class="nav-content">

    <!-- LOGO -->
    <a routerLink="/" class="logo" (click)="closeMenu()">Maratonic</a>

    <!-- Hamburger -->
    <div class="hamburger" (click)="toggleMenu()">
      <i class="fas" [ngClass]="isMenuOpen ? 'fa-times' : 'fa-bars'"></i>
    </div>

    <!-- MENU -->
    <ul class="nav-links" [class.active]="isMenuOpen">

      <li>
        <a routerLink="/"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="closeMenu()">
          Home
        </a>
      </li>

      <li>
        <a routerLink="/races"
           routerLinkActive="active"
           (click)="closeMenu()">
          Races
        </a>
      </li>

      <li>
        <a routerLink="/calendar"
           routerLinkActive="active"
           (click)="closeMenu()">
          Calendar
        </a>
      </li>

      <!-- Admin Görünümü -->
      <li *ngIf="isLoggedIn && isAdmin">
        <a routerLink="/admin"
           routerLinkActive="active"
           (click)="closeMenu()">
          Admin Dashboard
        </a>
      </li>

      <!-- Profil (Mobil Menü) -->
      <li *ngIf="isLoggedIn && isMenuOpen">
        <a routerLink="/profile"
           routerLinkActive="active"
           (click)="closeMenu()">
          Profile
        </a>
      </li>

      <!-- Mobil Auth -->
      <div class="mobile-auth" *ngIf="isMenuOpen">

        <!-- Giriş yapmamışsa -->
        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/login" class="btn login-btn" (click)="closeMenu()">Sign-In</a>
          <a routerLink="/register" class="btn signup-btn" (click)="closeMenu()">Sign-Up</a>
        </ng-container>

        <!-- Giriş yapmışsa -->
        <ng-container *ngIf="isLoggedIn">
          <a routerLink="/profile" class="btn login-btn" (click)="closeMenu()">Profile</a>
          <button class="btn logout-btn" (click)="logout(); closeMenu()">Logout</button>
        </ng-container>

      </div>

    </ul>

    <!-- DESKTOP AUTH -->
    <div class="nav-right">

      <!-- Giriş yapmamışsa -->
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" class="btn login-btn">Sign-In</a>
        <a routerLink="/register" class="btn signup-btn">Sign-Up</a>
      </ng-container>

      <!-- Giriş yapmışsa -->
      <ng-container *ngIf="isLoggedIn">
        <a routerLink="/profile" class="btn login-btn">Profile</a>
        <button class="btn logout-btn" (click)="logout()">Logout</button>
      </ng-container>

    </div>

  </div>
</nav>
