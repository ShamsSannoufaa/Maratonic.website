<nav class="navbar">
  <div class="nav-content">

    <!-- Logo -->
    <a routerLink="/" class="logo" (click)="closeMenu()">Maratonic</a>

    <!-- Hamburger -->
    <div class="hamburger" (click)="toggleMenu()">
      <i class="fas" [ngClass]="isMenuOpen ? 'fa-times' : 'fa-bars'"></i>
    </div>

    <!-- Navigation -->
    <ul class="nav-links" [class.active]="isMenuOpen">

      <li>
        <a routerLink="/"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="closeMenu()">
           Anasayfa
        </a>
      </li>

      <li>
        <a routerLink="/races"
           routerLinkActive="active"
           (click)="closeMenu()">
           Yarışlar
        </a>
      </li>

      <li>
        <a routerLink="/calendar"
           routerLinkActive="active"
           (click)="closeMenu()">
           Takvim
        </a>
      </li>

      <!-- Mobil auth -->
      <div class="mobile-auth" *ngIf="isMenuOpen && !isLoggedIn">
        <a routerLink="/login" class="btn login-btn" (click)="closeMenu()">Giriş Yap</a>
        <a routerLink="/register" class="btn signup-btn" (click)="closeMenu()">Kayıt Ol</a>
      </div>
    </ul>

    <!-- Desktop auth -->
    <div class="nav-right">

      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" class="btn login-btn">Giriş Yap</a>
        <a routerLink="/register" class="btn signup-btn">Kayıt Ol</a>
      </ng-container>

      <button *ngIf="isLoggedIn" class="btn login-btn" (click)="logout()">Çıkış Yap</button>

    </div>

  </div>
</nav>
