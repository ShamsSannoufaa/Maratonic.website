<h2 class="title">Dashboard Overview</h2>

<div class="stat-grid">

  <div class="stat-card">
    <h3>{{ stats.users }}</h3>
    <p>Total Users</p>
  </div>

  <div class="stat-card">
    <h3>{{ stats.races }}</h3>
    <p>Total Races</p>
  </div>

  <div class="stat-card">
    <h3>{{ stats.payments }}</h3>
    <p>Payments</p>
  </div>

  <div class="stat-card">
    <h3>${{ stats.revenue }}</h3>
    <p>Revenue</p>
  </div>

</div>
