

<!-- YARIŞ KARTLARI -->
<section class="features">
<h2 class="title">Yaklaşan Yarışlar</h2>
  <div class="race-grid">

    <div class="race-card" *ngFor="let race of races">

      <!-- DURUM ROZETİ -->
      <div class="status-badge" 
           [ngClass]="race.status === 'Open' ? 'open' : 'closed'">
        {{ race.status === 'Open' ? 'Açık' : 'Kapalı' }}
      </div>

      <!-- BANNER -->
      <div class="banner"
           [style.backgroundImage]="'url(' + race.banner + ')'">
      </div>

      <!-- BODY -->
      <div class="card-body">
        <h3 class="race-name">{{ race.name }}</h3>

        <div class="info-row">
          <i class="ri-calendar-event-line"></i>
          {{ race.date | date:'d MMMM y' }}
        </div>

        <div class="info-row">
          <i class="ri-map-pin-line"></i>{{ race.location }}
        </div>

        <div class="info-row">
          <i class="ri-run-line"></i>{{ race.distance }}
        </div>

        <div class="info-row">
          <i class="ri-money-dollar-circle-line"></i>
          {{ race.registrationFee }}₺
        </div>
      </div>

      <button class="detail-bar" [routerLink]="['/races', race.raceId]">
        Detay →
      </button>
    </div>

  </div>
</section>

<!-- CTA -->
<section class="cta-section">
  <h2>Hedefine Hazır Mısın?</h2>
  <p>Yeni bir yarış seç ve kendini test et.</p>

  <div class="cta-buttons">
    <a routerLink="/register" class="cta-btn primary">Kayıt Ol</a>
    <a routerLink="/profile" class="cta-btn secondary">Profilim</a>
  </div>
</section>
