<section class="features">
  <h2 class="title">Yaklaşan Yarışlar</h2>

  <div class="race-grid">

    <div class="race-card" *ngFor="let race of races">

      <!-- STATUS BADGE -->
      <div class="status-badge" [ngClass]="getStatusClass(race.status)">
        {{ getStatusLabel(race.status) }}
      </div>

      <div class="card-body">
        <h3 class="race-name">{{ race.name }}</h3>

        <div class="info-row">
          <i class="ri-calendar-line"></i>
          {{ race.date | date:'d MMMM y' }}
        </div>

        <div class="info-row">
          <i class="ri-map-pin-line"></i>
          {{ race.location }}
        </div>

        <div class="info-row" *ngIf="race.distance">
          🏃 {{ race.distance }}
        </div>

        <div class="info-row" *ngIf="race.difficultyLevel">
          ⚡ Zorluk: {{ race.difficultyLevel }}
        </div>

        <div class="info-row" *ngIf="race.surfaceType">
          🌍 Zemin: {{ race.surfaceType }}
        </div>

        <div class="info-row" *ngIf="race.elevationGain">
          ⛰️ Tırmanış: {{ race.elevationGain }} m
        </div>

        <div class="info-row">
          💰 {{ race.registrationFee }}₺
        </div>

      </div>

      <button class="detail-bar" [routerLink]="['/races', race.raceId]">
        Detay →
      </button>

    </div>

  </div>
</section>
