<div class="races-container">

  <h2 class="title">Upcoming Races</h2>
  <p class="subtitle">Discover events. Choose your next challenge.</p>

  <div class="race-grid">

    <div class="race-card"
         *ngFor="let race of races"
         (click)="openRace(race.raceId)">

      <div class="banner"
           [style.backgroundImage]="'url(' + race.banner + ')'">
      </div>

      <div class="card-body">
        <h3 class="race-name">{{ race.name }}</h3>

        <div class="info-row">
          <i class="ri-calendar-event-line"></i>
          {{ race.date | date:'MMMM d, y' }}
        </div>

        <div class="info-row">
          <i class="ri-map-pin-line"></i>{{ race.location }}
        </div>

        <div class="info-row">
          <i class="ri-run-line"></i>{{ race.distance }}
        </div>

        <div class="info-row">
          <i class="ri-money-dollar-circle-line"></i>
          {{ race.registrationFee }}₺
        </div>
      </div>

      <div class="status"
           [ngClass]="race.status === 'Open' ? 'open' : 'closed'">
        {{ race.status }}
      </div>

    </div>

  </div>
</div>
