<div class="races-wrapper">

  <h1 class="title">Upcoming Races</h1>
  <p class="subtitle">Discover events. Choose your next challenge.</p>

  <div class="races-grid">

    <div class="race-card" *ngFor="let race of races" [routerLink]="['/races', race.raceId]">

      <div class="race-image" [style.backgroundImage]="'url(' + race.banner + ')'"></div>

      <div class="race-info">
        <h3>{{ race.name }}</h3>

        <div class="race-meta">
          <span><i class="fas fa-calendar"></i> {{ race.date | date:'longDate' }}</span>
          <span><i class="fas fa-map-marker-alt"></i> {{ race.location }}</span>
        </div>

        <div class="race-details">
          <span><i class="fas fa-road"></i> {{ race.distance }}</span>
          <span><i class="fas fa-money-bill"></i> {{ race.registrationFee }}₺</span>
        </div>

        <div class="race-status" [ngClass]="race.status.toLowerCase()">
          {{ race.status }}
        </div>
      </div>

    </div>

  </div>
</div>
